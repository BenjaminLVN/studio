<meta name="theme-color" content="#0F2233">
<meta name="apple-mobile-web-app-title" content="Studio 420">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : barre de filtres à gauche (au-dessus sur mobile), grille de médias groupée par séance, visionneuse plein écran. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --ink:#0f2a36; --muted:#5a7380; --line:#d6e0e4;
  --accent:#0b6e8a; --accent-ink:#ffffff; --flag:#f2b705; --chip:#e8eff2; --chip-on:#0f2a36; --chip-on-ink:#ffffff;
  --shadow:0 10px 30px rgba(15,42,54,.18);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a21; --panel:#10242d; --ink:#e3eef2; --muted:#8fa8b3; --line:#1f3a46;
  --accent:#3fb3d4; --accent-ink:#06161c; --flag:#f2c230; --chip:#173039; --chip-on:#e3eef2; --chip-on-ink:#0b1a21;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1a21; --panel:#10242d; --ink:#e3eef2; --muted:#8fa8b3; --line:#1f3a46;
  --accent:#3fb3d4; --accent-ink:#06161c; --flag:#f2c230; --chip:#173039; --chip-on:#e3eef2; --chip-on-ink:#0b1a21;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand h1 .logo{width:34px;height:34px;border-radius:9px;flex:none;vertical-align:middle;margin-right:10px;position:relative;top:-3px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted)}
.demo-tag{display:inline-block;font-family:var(--f-mono);font-size:11px;background:var(--flag);color:#1b1b1b;padding:1px 7px;border-radius:3px;vertical-align:middle;margin-left:8px;letter-spacing:.03em}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;margin-top:20px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.filters-toggle{display:none}
@media (max-width:860px){
  .filters-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-weight:600}
  .filters.collapsed{display:none}
}
.filters{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:860px){.filters{position:static;max-height:none;overflow:visible}}
.search{position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.facet h3{margin:0 0 8px;font-family:var(--f-display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.facet h3 button{border:0;background:none;font-family:var(--f-body);font-size:12px;text-transform:none;letter-spacing:0;color:var(--accent);padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;line-height:1.3;transition:background .12s}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip:disabled{opacity:.38;cursor:default}
.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}
.seances{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:4px}
.srow{display:grid;grid-template-columns:16px 1fr auto auto;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:4px}
.srow:hover{background:var(--chip)}
.srow .box{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:grid;place-items:center;font-size:10px;line-height:1}
.srow[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.srow .wind,.srow .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow:disabled{opacity:.38;cursor:default}
.rule{font-size:12px;color:var(--muted);border-left:3px solid var(--flag);padding-left:10px;margin:0}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.count{font-family:var(--f-display);font-size:24px;font-weight:600}
.count small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:28px}
.active .chip{background:var(--accent);color:var(--accent-ink);font-size:12px}
.active .clear{border:0;background:none;color:var(--accent);font-size:12px;text-decoration:underline}
.inbox-btn{border:0;background:var(--flag);color:#1b1b1b;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600}
.inb{display:inline-block;background:var(--flag);color:#1b1b1b;border-radius:3px;padding:0 6px;font-size:11px;font-weight:600;margin-right:4px}
.view-opts{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.view-opts select{font:inherit;padding:5px 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}

.group{margin-bottom:26px}
.group-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:capitalize}
.group-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.group-h button{margin-left:auto;border:0;background:none;color:var(--accent);font-size:13px;padding:0}
.group-h button+button{margin-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.card{position:relative;background:var(--panel);border-radius:6px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card .open{border:0;padding:0;background:none;display:block;width:100%}
.card .thumb{aspect-ratio:16/10;max-width:100%;display:block;width:100%}
.card .thumb svg{display:block;width:100%;height:100%}
.card .meta{padding:7px 9px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .l1{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:600}
.card .l1 .t{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.card .l2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:7px;left:7px;background:rgba(6,22,28,.78);color:#fff;font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:3px;display:flex;align-items:center;gap:5px;pointer-events:none}
.sel{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(6,22,28,.35);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.card.is-sel{outline:3px solid var(--accent);outline-offset:-1px}
.card.is-sel .sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.lb .tools button{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

@media (max-width:560px){
  .tagpanel{place-items:end stretch;padding:0}

/* ---- mouvements ---- */

<script>
/* toute erreur s'affiche à la place de « Chargement… », pour savoir ce qui bloque */
window.onerror = (msg, src, line, col) => {
  const r = document.getElementById('results'); if (!r) return;
  const bits = [...document.scripts].map((sc, i) => { const l = (sc.textContent.split('\n')[line - 1] || '').trim(); return l ? 'script ' + i + ' : ' + l.slice(Math.max(0, (col || 0) - 80), (col || 0) + 80) : ''; }).filter(Boolean);
  r.innerHTML = '<div class="empty" style="text-align:left;white-space:pre-wrap;word-break:break-all">Erreur dans la page : ' + String(msg).replace(/</g, '&lt;') + ' (ligne ' + line + ', colonne ' + col + ')\n\n' + bits.join('\n\n').replace(/</g, '&lt;') + '</div>';
};
</script>
<script>
(function(){
/* pas de double barre oblique dans ce script : le serveur coupait la ligne après elle */
const DRV = 'https:' + '\/\/drive.google.com';
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
const DATA0 = null;
const ERR0 = "";
let D = null, THUMBS = {}, MEDIA = [], CUR = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* API : adresse /exec du Studio, remplie seulement dans studio.html (la page hébergée hors de Google). Elle appelle alors
   le script sans les cookies Google, ce qui marche même quand le navigateur a plusieurs comptes Google connectés. */
const API = 'https:' + '\/\/script.google.com/macros/s/AKfycbwK18sH_sE9y9MRqldv_cIG_Gep_L1ksQlc86fUtce_KFei6IrIRyJQzPAbzEdG-scW/exec';
const GESTION = PARAMS.gestion || '';
const run = (fn, ...a) => {
  const q = {fn, args: a, gestion: GESTION, p: fn === 'getData' ? PARAMS : {}};
  if (!API) return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko).appel(JSON.stringify(q)));
  return fetch(API, {method: 'POST', credentials: 'omit', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(q)})
    .then(r => { if (!r.ok) throw new Error('Le serveur du Studio a répondu ' + r.status + '. Réessayez dans un instant.'); return r.json(); })
    .then(o => { if (o.err) throw new Error(o.err); return o.ok; });
};
/* « Hors dates » : vidéos de référence (autres équipages, autre époque), rangées à part, après les séances */
const HORS = 'Hors dates', dk = d => d === HORS ? '' : d;
const fmtDate = d => d === HORS ? HORS : new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const fmtLong = d => d === HORS ? HORS : new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const duJour = d => d === HORS ? '« Hors dates »' : 'du ' + fmtLong(d);
const fmtSize = mo => mo >= 1000 ? (mo / 1000).toFixed(1).replace('.', ',') + ' Go' : (mo || 0) + ' Mo';
const PALETTE = ['#d1495b','#2a9d8f','#3d5a80','#e07a1f','#7b4fa0','#4f8a3c','#b5838d','#c9a227','#5e8b7e','#8c5e9e'];
const AUTRE = 'Autre';
const color = n => { const i = CUR.indexOf(n); return i < 0 ? '#9aa5a8' : PALETTE[i % PALETTE.length]; };
/* un équipage absent de la liste de la saison en cours reste affiché sur ses médias, en gris, avec sa saison */
const crewName = (n, long) => CUR.includes(n) || n === AUTRE ? esc(n) : `<span class="old">${esc(n)}${long && D.crewSeason[n] ? ' · saison ' + esc(D.crewSeason[n]) : ''}</span>`;
const thumb = (m, w) => THUMBS[m.id] ? THUMBS[m.id].replace(/=s\d+$/, '=s' + w) : `${DRV}/thumbnail?id=${m.id}&sz=w${w}`;

const VERSION = '12-11 hors dates'; /* à changer à chaque mise à jour : visible en haut de la page pour le propriétaire */
let FACETS = [], state = {q:'', grp:'seance'};
const selected = new Set();
let selAnchor = '';
function buildFacets(){
  const L = D.lists;
  FACETS = [
    {key:'mark', label:'Sélection', opts: ['★ Favoris','♥ Coups de cœur'], get: m => [m.star && '★ Favoris', m.heart && '♥ Coups de cœur'].filter(Boolean)},
    {key:'status', label:'Statut', opts: ['À taguer','Tagué'], get: m => [m.inbox ? 'À taguer' : 'Tagué']},
    {key:'seance', label:'Séance', opts: [...new Set(MEDIA.map(m => m.date))].sort((a, b) => (a === HORS) - (b === HORS) || a.localeCompare(b)), get: m => [m.date]},
    {key:'crew', label:'Équipage', opts: [...CUR, AUTRE], get: m => m.crews},
    {key:'allure', label:'Allure', opts: L.allures, get: m => [m.allure]},
    {key:'wind', label:'Force du vent', opts: L.vents, get: m => [m.wind]},
    {key:'man', label:'Situations', opts: L.mans, get: m => m.mans},
    {key:'type', label:'Type', opts: ['Photo','Vidéo'], get: m => [m.type]}
  ];
  FACETS.forEach(f => state[f.key] = state[f.key] || new Set());
}
const optLabel = (f, v) => f.key === 'seance' ? fmtDate(v) : v;
const textOf = m => [m.file, m.by, m.riders, m.info, m.allure, m.wind, ...m.mans, ...m.crews, fmtLong(m.date)].join(' ').toLowerCase();
function matches(m, except){
  for (const f of FACETS) { if (f.key === except) continue; const s = state[f.key]; if (s.size && !f.get(m).some(v => s.has(v))) return false; }
  if (state.q) { const t = textOf(m); if (!state.q.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false; }
  return true;
}
const visible = () => MEDIA.filter(m => matches(m)).sort((a, b) => (dk(b.date) + b.time).localeCompare(dk(a.date) + a.time));
function windOf(date){ const c = {}; MEDIA.forEach(m => { if (m.date === date && m.wind) c[m.wind] = (c[m.wind] || 0) + 1; }); return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || ''; }

function renderFilters(){
  let h = `<div class="search"><label for="q" class="note" style="display:block;margin-bottom:4px">Recherche libre (y compris les anciens équipages)</label><input id="q" type="search" placeholder="ex. Théo, empannages, IMG_…" value="${esc(state.q)}"></div>`;
  FACETS.forEach(f => {
    const counts = {};
    MEDIA.forEach(m => { if (matches(m, f.key)) f.get(m).forEach(v => counts[v] = (counts[v] || 0) + 1); });
    h += `<div class="facet"><h3>${f.label}${state[f.key].size ? `<button data-clear="${f.key}">Effacer</button>` : ''}</h3>`;
    if (f.key === 'crew') h += `<p class="note" style="margin:0 0 6px">Équipages ${esc(D.saison)}, repris du site.</p>`;
    if (f.key === 'seance') {
      h += `<div class="seances">` + f.opts.slice().reverse().map(v => {
        const on = state.seance.has(v), n = counts[v] || 0;
        return `<button class="srow" data-f="seance" data-v="${v}" aria-pressed="${on}" ${!n && !on ? 'disabled' : ''}><span class="box">${on ? '✓' : ''}</span><span>${fmtDate(v)}</span><span class="wind">${esc(windOf(v))}</span><span class="n">${n}</span></button>`;
      }).join('') + `</div>`;
    } else {
      h += `<div class="chips">` + f.opts.map(v => {
        const on = state[f.key].has(v), n = counts[v] || 0;
        const sw = f.key === 'crew' ? `<span class="sw" style="background:${color(v)}"></span>` : '';
        return `<button class="chip" data-f="${f.key}" data-v="${esc(v)}" aria-pressed="${on}" ${!n && !on ? 'disabled' : ''}>${sw}${esc(optLabel(f, v))}<span class="n">${n}</span></button>`;
      }).join('') + `</div>`;
    }
    h += `</div>`;
  });
  h += `<p class="rule">Dans une même rubrique, les choix s'additionnent (Près <em>ou</em> Largue). D'une rubrique à l'autre, ils se cumulent.</p>`;
  const had = document.activeElement && document.activeElement.id === 'q';
  $('filters').innerHTML = h;
  if (had) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

function marks(m, big){
  const one = (k, ic, lab) => D.me.owner
    ? `<button class="mk ${k}" data-mark="${k}" data-id="${m.id}" aria-pressed="${!!m[k]}" aria-label="${lab}" title="${lab}"${big ? ' style="font-size:20px"' : ''}>${ic}</button>`
    : (m[k] ? `<span class="mk ${k}" aria-pressed="true" title="${lab}">${ic}</span>` : '');
  return one('star', '★', 'Favori') + one('heart', '♥', 'Coup de cœur');
}
/* « Autre » laisse la place aux noms tapés à l'ouverture de la vidéo */
const crewsLabel = m => [...m.crews.filter(c => !(c === AUTRE && m.riders)).map(c => crewName(c)), m.riders && esc(m.riders)].filter(Boolean).join(' + ');
function card(m){
  const crews = crewsLabel(m) || 'Équipage ?', nc = commsOf(m.id).length;
  const sel = selected.has(m.id);
  const l2 = m.inbox ? `<span class="inb">À taguer</span>${esc([m.allure, m.wind, ...m.mans].filter(Boolean).join(' · '))}` : esc([m.allure, m.wind, m.mans.join(', ')].filter(Boolean).join(' · '));
  return `<article class="card${sel ? ' is-sel' : ''}">
    <button class="open" data-open="${m.id}" aria-label="Ouvrir ${esc(m.file)}"><div class="thumb"><img loading="lazy" alt="" src="${thumb(m, 480)}" data-tid="${m.id}"></div></button>
    ${m.type === 'Vidéo' ? `<span class="badge">▶ vidéo</span>` : ''}
    ${nc ? `<span class="cbadge" title="${nc} commentaire${nc > 1 ? 's' : ''}">💬 ${nc}</span>` : ''}
    <button class="sel" data-sel="${m.id}" aria-pressed="${sel}" aria-label="Sélectionner">${sel ? '✓' : ''}</button>
    <div class="meta"><div class="l1"><span class="nm">${crews}</span><span class="r">${marks(m)}<span class="t">${m.date === HORS ? 'Réf.' : esc(m.time)}</span></span></div>
    <div class="l2">${l2}</div>${m.info ? `<div class="l3" title="${esc(m.info)}">${esc(m.info)}</div>` : ''}</div></article>`;
}

let current = [];
function trashCard(m){
  return `<article class="card"><div class="thumb"><img loading="lazy" alt="" src="${thumb(m, 480)}" data-tid="${m.id}" style="opacity:.55"></div>
    ${m.type === 'Vidéo' ? `<span class="badge">▶ vidéo</span>` : ''}
    <div class="trash"><b style="color:var(--ink)">${esc(m.file)}</b><span>${m.date === HORS ? 'Hors dates' : 'Séance du ' + esc(m.date)} · supprimé le ${esc(m.le)}<br>Effacé pour de bon le ${esc(m.fin)}</span>
    <div class="row"><button class="p" data-restore="${m.id}">Restaurer</button><button class="k" data-purge="${m.id}">Supprimer définitivement</button></div></div></article>`;
}
function renderTrash(){
  const L = D.corbeille || [];
  $('count').innerHTML = `Corbeille<small>${L.length} média${L.length > 1 ? 's' : ''} · restaurables 15 jours</small>`;
  $('active').innerHTML = `<button class="trash-btn" data-trashview="0">← Retour au Studio</button>` + (L.length > 1 ? ` <button class="trash-btn" data-restore="*">Tout restaurer</button>` : '');
  $('results').innerHTML = L.length ? `<div class="grid">${L.map(trashCard).join('')}</div>`
    : `<div class="empty">La corbeille est vide. Un média supprimé y reste 15 jours, avec ses tags et ses commentaires, avant d'être effacé.</div>`;
}
function renderResults(){
  if (state.trash && D.me.owner) { current = []; renderTrash(); return; }
  current = visible();
  const nV = current.filter(m => m.type === 'Vidéo').length, nS = new Set(current.map(m => m.date).filter(d => d !== HORS)).size;
  $('count').innerHTML = `${current.length} média${current.length > 1 ? 's' : ''}<small>${current.length - nV} photos · ${nV} vidéos · ${nS} séance${nS > 1 ? 's' : ''}</small>`;
  let a = '';
  FACETS.forEach(f => state[f.key].forEach(v => a += `<button class="chip" data-f="${f.key}" data-v="${esc(v)}">${esc(optLabel(f, v))} ✕</button>`));
  if (state.q) a += `<button class="chip" data-clearq="1">« ${esc(state.q)} » ✕</button>`;
  const nAct = FACETS.reduce((s, f) => s + state[f.key].size, 0) + (state.q ? 1 : 0);
  if (nAct > 1) a += `<button class="clear" data-clearall="1">Tout effacer</button>`;
  const nIn = MEDIA.filter(m => m.inbox).length;
  if (D.me.staff && nIn && !state.status.has('À taguer')) a = `<button class="inbox-btn" data-inbox="1">Boîte d'arrivée : ${nIn} à taguer</button>` + a;

    <p class="note">Seuls les champs choisis sont modifiés. Les situations cochées s'ajoutent à celles déjà présentes.</p>
    <div class="facet"><h3>Équipages <span class="note" style="text-transform:none;letter-spacing:0;font-weight:400">plusieurs possibles, remplacent les équipages déjà notés</span></h3><div class="chips">${[...CUR, AUTRE].map(v => ch('crew', v, tagDraft.crew.has(v))).join('')}</div></div>
    <div class="facet"><h3>Allure</h3><div class="chips">${L.allures.map(v => ch('allure', v, tagDraft.allure === v)).join('')}</div></div>
    <div class="facet"><h3>Force du vent</h3><div class="chips">${L.vents.map(v => ch('wind', v, tagDraft.wind === v)).join('')}</div></div>
    <div class="facet"><h3>Ajouter des situations</h3><div class="chips">${L.mans.map(v => ch('man', v, tagDraft.man.has(v))).join('')}</div></div>
    <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-tgapply="1">Appliquer</button><button class="btn s" data-tgclose="1">Annuler</button></div></div>`;
  p.hidden = false;
}

/* ---------- événements ---------- */
document.addEventListener('click', async e => {
  if (e.target.closest('#home')) {
    e.preventDefault();
    FACETS.forEach(f => state[f.key].clear()); state.q = ''; state.trash = false; lbIdx = -1; renderLb(); renderAll();
    window.scrollTo({top: 0, behavior: 'smooth'}); return;
  }
  if (e.target.dataset && e.target.dataset.zoom) { lbWide = !lbWide; lbClasses(); return; }
  if (e.target.id === 'ribbon' && vid && vid.duration) { const r = e.target.getBoundingClientRect(); vid.currentTime = (e.clientX - r.left) / r.width * vid.duration; return; }
  const t = e.target.closest('button'); if (!t) { if (e.target.id === 'tagpanel') { tagDraft = null; renderTag(); } return; }
  const d = t.dataset;
  if (t.id === 'ftoggle') { const f = $('filters'); f.classList.toggle('collapsed'); t.setAttribute('aria-expanded', !f.classList.contains('collapsed')); return; }
  if (d.trashview) { state.trash = d.trashview === '1'; selected.clear(); renderAll(); window.scrollTo({top: 0}); return; }
  if (d.restore || d.purge) {
    const ids = d.restore === '*' ? D.corbeille.map(m => m.id) : [d.restore || d.purge];
    if (d.purge && !confirm('Supprimer définitivement ce média ? Le fichier part à la corbeille de Drive et ses tags et commentaires sont effacés.')) return;
    t.disabled = true;
    try {
      load(await run(d.restore ? 'restaurerMedia' : 'supprimerDefinitivement', ids));
      if (!D.corbeille.length) state.trash = false;
      renderAll(); toast(d.restore ? `${ids.length} média${ids.length > 1 ? 's' : ''} restauré${ids.length > 1 ? 's' : ''}.` : 'Média supprimé définitivement.');
    } catch (err) { t.disabled = false; toast(err.message); }
    return;
  }
  if (d.mark) {
    if (!D.me.owner) return;
    const m = MEDIA.find(x => x.id === d.id), on = !m[d.mark];
    m[d.mark] = on; renderAll(); if (!$('lb').hidden) renderLb();
    try { await run('setMark', m.id, d.mark, on); } catch (err) { m[d.mark] = !on; renderAll(); if (!$('lb').hidden) renderLb(); toast(err.message); }
    return;
  }
  if (d.f) { const s = state[d.f]; s.has(d.v) ? s.delete(d.v) : s.add(d.v); renderAll(); return; }
  if (d.clear) { state[d.clear].clear(); renderAll(); return; }
  if (d.inbox) { FACETS.forEach(f => state[f.key].clear()); state.q = ''; state.status.add('À taguer'); renderAll(); return; }
  if (d.clearq) { state.q = ''; renderAll(); return; }
  if (d.clearall) { FACETS.forEach(f => state[f.key].clear()); state.q = ''; renderAll(); return; }
  /* sélection multiple comme dans l'Explorateur : Ctrl (ou Cmd) + clic ajoute ou retire, Maj + clic prend toute la plage */
  const cardId = d.open || (d.sel && t.closest('.card') ? d.sel : '');
  if (cardId && (e.shiftKey || e.ctrlKey || e.metaKey)) {
    const ids = [...document.querySelectorAll('#results [data-open]')].map(b => b.dataset.open);
    if (e.shiftKey && selAnchor && ids.includes(selAnchor)) {
      const a = ids.indexOf(selAnchor), b = ids.indexOf(cardId);
      if (!e.ctrlKey && !e.metaKey) selected.clear();
      ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(id => selected.add(id));
    } else {
      selected.has(cardId) ? selected.delete(cardId) : selected.add(cardId);
      selAnchor = cardId;
    }
    renderResults(); renderSelbar(); return;
  }
  if (d.open) { lbIdx = current.findIndex(m => m.id === d.open); renderLb(); return; }
  if (d.sel) { selAnchor = d.sel; selected.has(d.sel) ? selected.delete(d.sel) : selected.add(d.sel); renderResults(); renderSelbar(); if (!$('lb').hidden) renderLb(); return; }
  if (d.lbfull) { setFull(!lbFull); return; }
  if (d.lbside) { lbSide = !lbSide; lbClasses(); return; }
  if (d.lbwide) { lbWide = !lbWide; lbClasses(); return; }
  if (d.seek !== undefined) {
    if (vid) { vid.currentTime = Math.max(0, Number(d.seek) - 1); vid.play().catch(() => {}); }
    else toast('Avancez la vidéo à ' + fmtT(Number(d.seek)) + '.');
    return;
  }
  if (d.cnow) { if (vid) $('ctime').value = fmtT(vid.currentTime); $('cat').checked = true; return; }
  if (d.cadd) { addComm(t); return; }
  if (d.cdel) { delComm(d.cdel); return; }
  if (d.cedit || d.ccancel) {
    cEdit = d.cedit || ''; const m = current[lbIdx]; $('lbaside').innerHTML = asideHtml(m);
    if (cEdit) { if (vid && !vid.paused) vid.pause(); const ta = $('cetext'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if (d.cenow) { if (vid) $('cetime').value = fmtT(vid.currentTime || 0); return; }
  if (d.csave) { saveComm(t); return; }
  if (d.selgroup) { current.filter(m => m.date === d.selgroup).forEach(m => selected.add(m.id)); renderResults(); renderSelbar(); return; }
  if (d.delsel) {
    const n = selected.size;
    if (!confirm(`Supprimer ${n} média${n > 1 ? 's' : ''} ? Ils vont dans la Corbeille du Studio, d'où vous pouvez les restaurer pendant 15 jours.`)) return;
    t.disabled = true; t.textContent = 'Suppression…';
    try {
      load(await run('supprimerMedia', [...selected]));
      selected.clear(); lbIdx = -1; renderLb(); renderAll();
      toast(`${n} média${n > 1 ? 's' : ''} mis à la corbeille (restaurable${n > 1 ? 's' : ''} 15 jours).`);
    } catch (err) { t.disabled = false; t.textContent = 'Supprimer'; toast(err.message); }
    return;
  }
  if (d.unsel) { selected.clear(); renderResults(); renderSelbar(); return; }
  if (d.dlsel) {
    const items = MEDIA.filter(m => selected.has(m.id));
    $('tagpanel').innerHTML = `<div class="box"><h2>Télécharger ${items.length} fichier${items.length > 1 ? 's' : ''}</h2>
      <p class="note">Chaque lien télécharge l'original en pleine résolution. Pour une séance entière, ouvrez son dossier dans Drive et choisissez « Télécharger » : Drive prépare un .zip.</p>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto">${items.map(m => `<a href="${dlUrl(m)}" target="_blank" rel="noopener">${esc(m.file)} · ${fmtSize(m.size)}</a>`).join('')}</div>
      <div class="acts"><button class="btn s" data-tgclose="1">Fermer</button></div></div>`;
    $('tagpanel').hidden = false; tagDraft = null; return;
  }
  if (d.bilan) {
    /* lien à coller dans le champ « Image ou vidéo de la photothèque » d'un bilan du site : la vidéo s'y lit directement */
    const url = `${DRV}/file/d/${d.bilan}/view`, box = $('bilanLink');
    box.hidden = false;
    box.innerHTML = `<p class="note" style="margin-bottom:4px">Copie ce lien et colle-le dans le bilan, sur le site.</p><input id="bilanUrl" readonly value="${url}" style="width:100%;padding:7px;font:inherit;font-size:12px">`;
    const i = $('bilanUrl'); i.focus(); i.select();
    try { navigator.clipboard.writeText(url).then(() => toast('Lien copié : colle-le dans le bilan.'), () => {}); } catch (err) {}
    return;
  }
  if (d.lbnav) { lbIdx = (lbIdx + Number(d.lbnav) + current.length) % current.length; renderLb(); return; }
  if (d.lbclose) { lbIdx = -1; renderLb(); return; }
  if (d.direct) { $('lb').dataset.id = ''; renderLb(); return; } /* recharge la vidéo avec le lecteur direct */
  if (d.lt) {
    const m = current[lbIdx], v = d.v;
    if (d.lt === 'crews' || d.lt === 'mans') m[d.lt] = m[d.lt].includes(v) ? m[d.lt].filter(x => x !== v) : [...m[d.lt], v];
    else m[d.lt] = m[d.lt] === v ? '' : v;
    m.inbox = !(m.crews.length || m.allure || m.wind || m.mans.length);
    paintTags(m); queueTags(m); gridDirty = true; return;
  }
  if (d.info) {
    const m = MEDIA.find(x => x.id === d.info); t.disabled = true; t.textContent = 'Enregistrement…';
    try { m.info = await run('setInfo', m.id, $('info').value); gridDirty = true; $('info').value = m.info; toast(m.info ? 'Info enregistrée.' : 'Info effacée.'); }
    catch (err) { toast(err.message); }
    t.disabled = false; t.textContent = 'Enregistrer'; return;
  }
  if (d.riders) {
    const m = MEDIA.find(x => x.id === d.riders), val = $('riders').value; t.disabled = true; t.textContent = 'Enregistrement…';
    try {
      await flushTags();
      Object.assign(m, JSON.parse(await run('setCoureurs', m.id, val)));
      gridDirty = true; t.disabled = false; t.textContent = 'Enregistrer'; paintTags(m); toast(m.riders ? 'Coureurs enregistrés.' : 'Coureurs effacés.');
    } catch (err) { t.disabled = false; t.textContent = 'Enregistrer'; toast(err.message); }
    return;
  }
  if (d.mdel) {
    if (!confirm('Supprimer ce média ? Il va dans la Corbeille du Studio, d\'où vous pouvez le restaurer pendant 15 jours.')) return;
    t.disabled = true; t.textContent = 'Suppression…';
    try {
      load(await run('supprimerMedia', d.mdel));
      lbIdx = -1; renderLb(); selected.delete(d.mdel); renderAll(); toast('Média mis à la corbeille (restaurable 15 jours).');
    } catch (err) { t.disabled = false; t.textContent = 'Supprimer ce média'; toast(err.message); }
    return;
  }
  if (d.tag) {
    /* équipages déjà cochés quand toute la sélection a les mêmes */
    const sel = MEDIA.filter(m => selected.has(m.id)), k = m => [...m.crews].sort().join('|');
    const same = sel.length && sel.every(m => k(m) === k(sel[0]));
    tagDraft = {crew: new Set(same ? sel[0].crews : []), allure:'', wind:'', man:new Set()}; renderTag(); return;
  }
  if (d.tg) {
    if (d.tg === 'man' || d.tg === 'crew') tagDraft[d.tg].has(d.v) ? tagDraft[d.tg].delete(d.v) : tagDraft[d.tg].add(d.v);
    else tagDraft[d.tg] = tagDraft[d.tg] === d.v ? '' : d.v;
    renderTag(); return;
  }
  if (d.tgclose) { tagDraft = null; $('tagpanel').hidden = true; return; }
  if (d.datesel || d.dategroup || d.dateone) {
    /* une vidéo, une séance entière ou la sélection : même fenêtre */
    const ids = d.dateone ? [d.dateone] : d.dategroup ? MEDIA.filter(m => m.date === d.dategroup).map(m => m.id) : [...selected];
    const n = ids.length, from = MEDIA.find(m => m.id === ids[0]).date, hors = from === HORS;
    dateIds = ids; tagDraft = null;
    $('tagpanel').innerHTML = `<div class="box"><h2>Changer la date</h2>
      <p class="note">${n} média${n > 1 ? 's' : ''}${d.dategroup ? (hors ? ` rangé${n > 1 ? 's' : ''} « Hors dates »` : ' de la séance du ' + fmtLong(d.dategroup)) : ''}. Choisissez le vrai jour de prise de vue, ou cochez « Hors dates ».</p>
      <input type="date" id="newdate" value="${hors ? '' : from}"${hors ? ' disabled' : ''} style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)">
      <label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0;cursor:pointer"><input type="checkbox" id="horsdates"${hors ? ' checked' : ''} onchange="document.getElementById('newdate').disabled = this.checked" style="margin-top:3px"><span><b>Hors dates</b><br><span class="note">Vidéo de référence (autre équipage, autre époque) : rangée à part, sans séance.</span></span></label>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-dateapply="1">Enregistrer</button><button class="btn s" data-tgclose="1">Annuler</button></div></div>`;
    $('tagpanel').hidden = false; $(hors ? 'horsdates' : 'newdate').focus(); return;
  }
  if (d.dateapply) {
    const v = $('horsdates').checked ? HORS : $('newdate').value, n = dateIds.length;
    if (!v) { $('newdate').focus(); return; }
    t.disabled = true; t.textContent = 'Enregistrement…';
    try {
      load(await run('changerDate', dateIds, v));
      state.seance.forEach(x => { if (!MEDIA.some(m => m.date === x)) state.seance.delete(x); });
      selected.clear(); $('tagpanel').hidden = true; lbIdx = -1; renderLb(); renderAll();
      toast(v === HORS ? `${n} média${n > 1 ? 's' : ''} rangé${n > 1 ? 's' : ''} « Hors dates ».` : `${n} média${n > 1 ? 's' : ''} daté${n > 1 ? 's' : ''} du ${fmtLong(v)}.`);
    } catch (err) { t.disabled = false; t.textContent = 'Enregistrer'; toast(err.message); }
    return;
  }
  if (d.tgapply) {
    const n = selected.size; t.disabled = true; t.textContent = 'Enregistrement…';
    try {
      load(await run('tagMedia', [...selected], {crews: [...tagDraft.crew], allure: tagDraft.allure, wind: tagDraft.wind, addMans: [...tagDraft.man]}));
      tagDraft = null; selected.clear(); renderTag(); renderAll();
      toast(`${n} média${n > 1 ? 's' : ''} tagué${n > 1 ? 's' : ''}.`);
    } catch (err) { t.disabled = false; t.textContent = 'Appliquer'; toast(err.message); }
  }
});
document.addEventListener('mousedown', e => { if (e.shiftKey && e.target.closest('#results .card')) e.preventDefault(); });
document.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value.trim(); renderAll(); } });
document.addEventListener('error', e => { const i = e.target; if (i.tagName === 'IMG' && i.dataset.tid && !i.dataset.retry) { i.dataset.retry = 1; i.style.background = 'var(--chip)'; } }, true);
$('grp').addEventListener('change', e => { state.grp = e.target.value; renderResults(); });
document.addEventListener('keydown', e => {
  if (!$('tagpanel').hidden && e.key === 'Escape') { tagDraft = null; $('tagpanel').hidden = true; return; }
  if ($('lb').hidden) return;
  if (e.target.id === 'riders' && e.key === 'Enter') { const b = document.querySelector('[data-riders]'); if (b) b.click(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && lbFull) { setFull(false); return; }
  if (e.key === 'Escape') { lbIdx = -1; renderLb(); }
  if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % current.length; renderLb(); }
  if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + current.length) % current.length; renderLb(); }
});
if (window.matchMedia('(min-width: 861px)').matches) $('filters').classList.remove('collapsed');

/* ---------- arrivée depuis le site « Gestion de saison 420 » ---------- */
const THEMES = {
  'Départs': {man: ['Départs']},
  'Manœuvres': {man: ['Virements','Envoi L','Envoi VA','Empannages LL','Empannages VA','Enroulée dessous','Ressalage']},
  'Vitesse près': {allure: ['Près']},
  'Vitesse portant': {allure: ['Largue','Vent arrière']},
  'Bouées': {man: ['Enroulée dessous']}
};
function applyParams(p){
  const notes = [], norm = s => String(s).replace(/\s+/g, '').replace(/[‐-―-]/g, '–');
  if (p.equipage) CUR.includes(p.equipage) ? state.crew.add(p.equipage) : notes.push(`équipage « ${p.equipage} » absent de la saison`);
  if (p.type === 'video') state.type.add('Vidéo'); if (p.type === 'photo') state.type.add('Photo');
  if (p.date === 'hors') p.date = HORS;
  if (p.date) MEDIA.some(m => m.date === p.date) ? state.seance.add(p.date) : notes.push(`aucun média ${duJour(p.date)}`);
  if (p.vent) { const w = D.lists.vents.find(x => norm(x) === norm(p.vent)); w ? state.wind.add(w) : notes.push(`vent « ${p.vent} » non reconnu`); }
  if (p.theme) { const m = THEMES[p.theme]; if (m) { (m.man || []).forEach(x => state.man.add(x)); (m.allure || []).forEach(x => state.allure.add(x)); } else notes.push(`thème « ${p.theme} » pas encore tagué`); }
  if (notes.length) toast('Filtres du site appliqués. À noter : ' + notes.join(', ') + '.');
}

/* « Changer de compte » sans compte Google : vue visiteur, ou code de gestion du propriétaire */
const baseAcces = () => API ? location.origin + location.pathname : (D.exec || '');
function changerAcces(){
  const P = $('tagpanel'), base = baseAcces();
  P.innerHTML = `<div class="box"><h2>Changer de compte</h2>
    <p class="note">Vous êtes actuellement en <b>${D.me.gestion ? 'gestion (propriétaire)' : 'lecture (visiteur)'}</b>.</p>
    ${D.me.gestion && D.cle && base ? `<a class="btn s" target="_top" href="${esc(base + '?cle=' + encodeURIComponent(D.cle))}">Voir le Studio comme un visiteur</a>` : ''}
    <div class="infobox"><label for="codeGestion">Code de gestion (la fin de votre lien de gestion, après « gestion= »)</label>
    <input id="codeGestion" type="password" autocomplete="current-password" style="width:100%;padding:10px 12px;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);background:var(--panel);color:var(--ink);font:inherit"></div>
    <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-acces="1">Ouvrir en gestion</button><button class="btn s" data-tgclose="1">Fermer</button></div></div>`;
  P.hidden = false; setTimeout(() => { const i = $('codeGestion'); if (i) i.focus(); }, 50);
}
document.addEventListener('click', e => {
  if (!e.target.closest('[data-acces]')) return;
  const code = ($('codeGestion').value || '').trim().replace(/^.*gestion=/, '').replace(/[&#].*$/, ''), base = baseAcces();
  if (!code) { toast('Collez votre code ou votre lien de gestion.'); return; }
  if (!base) { toast('Adresse du Studio inconnue : ouvrez directement votre lien de gestion.'); return; }
  window.top.location.href = base + '?gestion=' + encodeURIComponent(code);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'codeGestion') document.querySelector('[data-acces]').click(); });
function load(json){
  D = JSON.parse(json); MEDIA = D.medias; CUR = D.lists.crews;
  buildFacets();
  $('who').textContent = D.me.gestion ? 'Lien de gestion' : D.me.pub ? 'Accès par lien' : 'Connecté avec ' + D.me.email;
  /* lien public : le bouton sert à se connecter avec son compte Google (propriétaire, coachs).
     Inutile avec le lien de gestion, et sans effet dans studio.html, qui n'utilise pas les comptes Google. */
  const a = $('who').parentNode.querySelector('a');
  if (a) {
    /* page GitHub ou lien de gestion : pas de compte Google, le bouton passe d'un accès à l'autre (gestion ou visiteur) */
    if (D.me.gestion || API) { a.textContent = 'Changer de compte'; a.style.display = ''; a.onclick = ev => { ev.preventDefault(); changerAcces(); }; }
    else if (D.me.pub) a.textContent = 'Se connecter';
  }
  $('sub').textContent = `Saison ${D.saison} · ${MEDIA.length} médias · ${D.me.owner ? 'propriétaire' : D.me.staff ? 'coach' : D.me.pub ? 'lecture' : 'coureur'}${D.me.owner ? ' · version ' + VERSION + (D.version === VERSION ? '' : ' (Code.gs : ' + (D.version || 'ancien') + ')') : ''}`;
}
/* délai dépassé : presque toujours plusieurs comptes Google connectés dans le navigateur */
const timeout = ms => new Promise((_, ko) => setTimeout(() => ko(new Error(API ? 'Le serveur du Studio ne répond pas. Vérifiez la connexion internet, puis rechargez la page.' : 'Le serveur ne répond pas. Si plusieurs comptes Google sont connectés dans ce navigateur, ouvrez le Studio dans une fenêtre privée avec un seul compte.')), ms));
(DATA0 ? Promise.resolve(DATA0) : ERR0 ? Promise.reject(new Error('Erreur du serveur : ' + ERR0)) : Promise.race([run('getData', PARAMS.cle), timeout(30000)])).then(json => {
  load(json); applyParams(PARAMS); renderAll();
  run('getThumbs', PARAMS.cle).then(t => { THUMBS = JSON.parse(t); document.querySelectorAll('img[data-tid]').forEach(i => { const m = MEDIA.find(x => x.id === i.dataset.tid); if (m && THUMBS[m.id]) i.src = thumb(m, 480); }); }).catch(() => {});
}).catch(err => { $('results').innerHTML = `<div class="empty">${esc(err.message)}</div>`; $('sub').textContent = ''; });
})();
</script>
